# 이랑 데이터 자동 동기화
# - 매일 06:00 KST (21:00 UTC)에 실행
# - Phase A: RDA API 동기화 + 상태 자동 업데이트
# - Phase B: 정부/공공 사이트 크롤링
#
# 2026-09-29: 실패 판정 교정.
#   기존에는 `if [ "$http_code" -ge 500 ]` 하나로만 봤고 그마저 warning이라,
#   `rda-events` 타겟이 **매일 HTTP 400 `{"error":"Unknown target"}`** 을 받으면서도
#   워크플로는 초록이었다(배포본에 타겟이 없었던 것). `data_sync_log` events 행 0건.
#   이제 2xx 아니면 실패, 본문에 "error"가 있어도 실패로 본다.

name: Daily Data Sync

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST (UTC+9)
  workflow_dispatch: # 수동 실행 지원

jobs:
  sync-rda:
    name: "Phase A: RDA API Sync"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-rda Edge Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/sync-rda" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30) || true

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          case "$http_code" in
            2*) ;;
            *) echo "::error::sync-rda failed with HTTP '$http_code'"; exit 1 ;;
          esac

  sync-crawl:
    name: "Phase B: Crawl Sites"
    runs-on: ubuntu-latest
    needs: sync-rda
    strategy:
      fail-fast: false
      matrix:
        target:
          - rda-programs
          - rda-education
          - agrix-programs
          - rda-events
          - greendaero-education
          - greendaero-live
    steps:
      - name: "Crawl: ${{ matrix.target }}"
        run: |
          # 그린대로는 200건 페이지를 최대 3회 받아오므로 여유를 둔다
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/sync-crawl" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"target": "${{ matrix.target }}"}' \
            --max-time 150) || true

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          # 1) 응답이 없거나 2xx가 아니면 실패.
          #    특히 400 "Unknown target"은 Edge Function 재배포 누락 신호다.
          case "$http_code" in
            2*) ;;
            "") echo "::error::${{ matrix.target }}: 응답 없음 (타임아웃 추정)"; exit 1 ;;
            400)
              echo "::error::${{ matrix.target }}: HTTP 400 — 배포본에 타겟이 없을 수 있습니다. 'supabase functions deploy sync-crawl' 확인"
              exit 1
              ;;
            *) echo "::error::${{ matrix.target }}: HTTP $http_code"; exit 1 ;;
          esac

          # 2) 2xx여도 본문 ok:false 면 실패다.
          #    `errors`에는 DB upsert 실패·수집 예외만 담긴다(개별 링크 불량은 담기지 않음).
          #    대표 사례: `sigungu` 컬럼 마이그레이션을 apply하기 전에 함수를 배포하면
          #    모든 upsert가 "column does not exist"로 실패하면서 응답은 200이다.
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::${{ matrix.target }}: 수집/적재 실패 — $body"
            exit 1
          fi
