# GA4 스냅샷 (2026-09-08) — M7 판정 기준선용 핵심 지표를 월 1회(+수동) 뽑아 이슈로 발행.
# 시크릿: GA4_PROPERTY_ID(숫자), GA4_SA_JSON(서비스 계정 JSON, 속성 뷰어). 라벨 ga4-snapshot.
name: GA4 snapshot

on:
  schedule:
    - cron: "30 0 1 * *" # 매월 1일 KST 09:30
  workflow_dispatch:
    inputs:
      days:
        description: "조회 창(일)"
        default: "28"
      diag:
        description: "진단 모드 — 호스트·해상도·도시별 분해(이슈 미발행, 스텝 요약만)"
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run report
        id: report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_DAYS: ${{ github.event.inputs.days || '28' }}
          GA4_DIAG: ${{ github.event.inputs.diag == 'true' && '1' || '' }}
        run: node scripts/watchman/ga4-snapshot.mjs | tee snapshot.md
      # 결과 0건 검색어 재대조 (10/13) — 그때 0건이던 검색어가 지금은 어떤지 + 붙여 쓴 지역명 착수 기준(3회)
      # 검색 인덱스(TS)를 그대로 돌려야 해서 의존성 설치가 필요하다. 실패해도 GA 스냅샷 이슈는 발행한다.
      - name: Install deps (zero-result recheck)
        if: github.event.inputs.diag != 'true'
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - name: Zero-result recheck
        if: github.event.inputs.diag != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/watchman/zero-result-recheck.ts --ci | tee -a snapshot.md
      - name: Open issue
        if: github.event.inputs.diag != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ga4-snapshot --color 1B6B5A --description "GA4 M7 기준선 스냅샷" 2>/dev/null || true
          gh issue create --title "GA4 스냅샷 $(date -u +%Y-%m-%d)" --label ga4-snapshot --assignee KangseonLEE --body-file snapshot.md
