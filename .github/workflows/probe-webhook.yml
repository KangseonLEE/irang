# 임시 진단 (2026-09-30): Sentry 웹훅 요청이 CF 에서 어떤 action 을 받았는지 + US 러너 응답. 확인 후 삭제.
name: "Probe sentry-webhook (CF events + US runner)"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: CF firewall events for /api/sentry-webhook (last 3h)
        run: |
          SINCE=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ); UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q=$(jq -nc --arg z "$CF_ZONE_ID" --arg s "$SINCE" --arg u "$UNTIL" '{query:"query($z:String!,$s:Time!,$u:Time!){viewer{zones(filter:{zoneTag:$z}){firewallEventsAdaptive(limit:50,filter:{datetime_geq:$s,datetime_leq:$u,clientRequestPath:\"/api/sentry-webhook\"},orderBy:[datetime_DESC]){datetime action source ruleId clientIP clientCountryName clientASNDescription userAgent}}}}",variables:{z:$z,s:$s,u:$u}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d "$Q" | jq -r '.errors // empty, (.data.viewer.zones[0].firewallEventsAdaptive[]? | "\(.datetime) action=\(.action) source=\(.source) rule=\(.ruleId[0:8]) ip=\(.clientIP) \(.clientCountryName) \(.clientASNDescription) ua=\(.userAgent[0:40])")'
      - name: US runner unsigned POST
        run: |
          curl -s -D - -o /dev/null -X POST -H "Content-Type: application/json" -H "sentry-hook-resource: event_alert" -A "sentry/26.0" -d '{}' https://irangfarm.com/api/sentry-webhook | grep -iE "^HTTP/|cf-mitigated|server:" 
