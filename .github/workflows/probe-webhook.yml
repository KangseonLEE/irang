# 임시 진단 (2026-09-30): Sentry 웹훅 요청이 CF 에서 어떤 action 을 받았는지 + US 러너 응답. 확인 후 삭제.
name: "Probe sentry-webhook (CF events + US runner)"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      DEP: https://irang-k2em6bktf-kangseonlees-projects.vercel.app
    steps:
      - name: CF firewall events for /api/sentry-webhook (last 3h)
        run: |
          SINCE=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ); UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q=$(jq -nc --arg z "$CF_ZONE_ID" --arg s "$SINCE" --arg u "$UNTIL" '{query:"query($z:String!,$s:Time!,$u:Time!){viewer{zones(filter:{zoneTag:$z}){firewallEventsAdaptive(limit:50,filter:{datetime_geq:$s,datetime_leq:$u,clientRequestPath:\"/api/sentry-webhook\"},orderBy:[datetime_DESC]){datetime action source ruleId clientIP clientCountryName clientASNDescription userAgent edgeResponseStatus clientRequestHTTPMethodName clientRequestHTTPHost}}}}",variables:{z:$z,s:$s,u:$u}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d "$Q" | jq -r '.errors // empty, (.data.viewer.zones[0].firewallEventsAdaptive[]? | "\(.datetime) action=\(.action) source=\(.source) rule=\(.ruleId[0:8]) ip=\(.clientIP) \(.clientCountryName) \(.clientASNDescription) \(.clientRequestHTTPMethodName) host=\(.clientRequestHTTPHost) edge=\(.edgeResponseStatus) ua=\(.userAgent[0:40])")' | head -8
      - name: US runner → vercel.app direct (CF bypass) probes
        run: |
          python3 -c "import json;print(json.dumps({'action':'triggered','data':{'event':{'title':'probe','message':'x'*20000}}}))" > body.json
          H='-H Content-Type:application/json -H sentry-hook-resource:event_alert -H sentry-hook-timestamp:1790752000 -H sentry-hook-signature:deadbeef -A sentry/26.10.0.dev0'
          for CASE in "A cf-ipcountry:US $DEP/api/sentry-webhook" "B x-none:1 $DEP/api/sentry-webhook" "C cf-ipcountry:US $DEP/api/assess" "D cf-ipcountry:US https://irangfarm.com/api/sentry-webhook"; do
            set -- $CASE; echo "=== case $1 ($2 → $3)"
            curl -s -o /dev/null -D - -X POST -H "$2" $H --data-binary @body.json "$3" | grep -iE "^HTTP/|x-vercel|server:|retry-after|cf-mitigated|content-type" | tr -d '\r'
          done
          echo "=== case E GET $DEP/api/sentry-webhook"; curl -s -D - -H "cf-ipcountry: US" -A "sentry/26.10.0.dev0" "$DEP/api/sentry-webhook" | grep -iE "^HTTP/|x-vercel-id|^\{" | tr -d '\r'
