# ═══════════════════════════════════════════
# Cloudflare Web Analytics 자동 삽입 관리 (2026-10-07)
#
# Cloudflare 가 모든 HTML 끝에 Web Analytics 스크립트(static.cloudflareinsights.com/beacon.min.js)를 넣는데,
# 우리 CSP(script-src)가 막아 전 페이지 콘솔에 오류만 찍히고 수집은 한 번도 되지 않았다(10/7 QA).
# 방문 집계는 GA4 하나로 두고(내부·테스트 트래픽 게이트가 GA4 에만 있다) 자동 삽입을 끈다 — CSP 를 넓히지 않는다.
#
# 사용: gh workflow run cf-web-analytics.yml -f action=inspect | disable-auto-install
#   inspect              — 계정의 Web Analytics 사이트·자동 삽입 상태만 본다(변경 없음)
#   disable-auto-install — irangfarm.com 사이트의 자동 삽입(auto_install)을 끈다. 되돌리기는 대시보드
#                          Analytics & Logs → Web Analytics → irangfarm.com → Manage site 에서 다시 켠다
# 확인: 한국 회선에서 운영 HTML 에 cloudflareinsights 가 없어야 한다(미국 러너는 KR 외 차단으로 HTML 을 못 본다)
#   — 브라우저 헤더(Accept: text/html, 압축)로 받아야 보인다. curl 기본 헤더엔 삽입되지 않는다
# 권한: CF_API_TOKEN 에 계정 Web Analytics 권한이 있어야 한다. 10/7 첫 실행은 code 10000(Authentication error) —
#   같은 토큰·계정으로 Workers 배포는 되므로 계정 ID 가 아니라 권한 문제. 권한이 없으면 대시보드에서 직접 끈다
#   (Analytics & Logs → Web Analytics → irangfarm.com → Manage site → 자동 설치 끄기)
# 2026-10-08: 회장이 대시보드에서 Disable — 운영 HTML·콘솔 0건 확인. 이 워크플로는 다시 켜졌는지 볼 때(inspect, 권한 필요)만 쓴다
# ═══════════════════════════════════════════
name: Cloudflare Web Analytics

on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect(조회만) 또는 disable-auto-install(자동 삽입 끄기)"
        type: choice
        options: [inspect, disable-auto-install]
        default: inspect

permissions:
  contents: read

jobs:
  rum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Web Analytics 사이트 조회
        run: |
          set -u
          A="Authorization: Bearer $CF_API_TOKEN"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/rum/site_info/list?per_page=50" -H "$A" > rum.json
          # 토큰·계정 값은 찍지 않는다. 사이트 토큰은 운영 HTML 에 공개된 값이라 앞 8자만
          jq -r 'if .success then (.result[] | "host=\(.host // .ruleset.zone_name // "?") site=\(.site_tag[0:8]) auto_install=\(.auto_install) enabled=\(.ruleset.enabled // "?")") else "조회 실패: \(.errors | tostring)" end' rum.json
          jq -e '.success' rum.json >/dev/null

      - name: irangfarm.com 자동 삽입 끄기
        if: inputs.action == 'disable-auto-install'
        run: |
          set -u
          A="Authorization: Bearer $CF_API_TOKEN"
          SITE=$(jq -r '.result[] | select((.host // .ruleset.zone_name // "") == "irangfarm.com") | .site_tag' rum.json | head -1)
          if [ -z "$SITE" ]; then echo "::error::irangfarm.com Web Analytics 사이트를 못 찾았어요"; exit 1; fi
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/rum/site_info/$SITE" \
            -H "$A" -H "Content-Type: application/json" --data '{"auto_install": false}' > put.json
          jq -r 'if .success then "끔: host=\(.result.host // .result.ruleset.zone_name) auto_install=\(.result.auto_install)" else "변경 실패: \(.errors | tostring)" end' put.json
          jq -e '.success and (.result.auto_install == false)' put.json >/dev/null
