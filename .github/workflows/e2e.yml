name: E2E critical paths

# 2026-09-17: `on: push` 제거 (회장 지시 — Vercel Hobby 한도 조치).
# 프로덕션 대상 E2E 가 푸시마다 돌면서 Fluid Active CPU·Function Invocations 를
# 자체 소비했다(하루 20~26 푸시). 전체 스위트는 하루 1회로 내리고, 푸시 시점
# 안전망은 `e2e-smoke.yml`(@smoke 2건)이 맡는다.
on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST
  workflow_dispatch:
    inputs:
      base_url:
        description: "테스트할 baseURL — 비우면 러너 안 운영 빌드(local), 운영을 직접 칠 때만 https://irangfarm.com"
        required: false
        default: ""

# 동일 ref에서 중복 실행 방지 (push가 연이어 들어오는 경우)
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium desktop + mobile)
    runs-on: ubuntu-latest
    # 러너 안 빌드(약 5~8분)가 들어가 15 → 30분
    timeout-minutes: 30
    env:
      # 2026-10-30 Vercel Fluid Active CPU 한도 2순위(회장 결재): 매일 07:00 전체 스위트를 운영이 아니라
      # 러너 안에서 release 트리로 만든 운영 빌드(next start)에 친다. 10/26 측정에서 운영 대상 전체 E2E 1회 =
      # 밤 9시간 열람과 같은 함수 CPU 였다. 잡는 회귀는 같은 코드라 같고, 운영 CPU 는 0.
      # 운영 고유 계층(CF Worker·WAF·Vercel 엣지)은 배포 직후 e2e-smoke.yml 이 운영에서 본다.
      # 수동 실행에 base_url 을 주면 그 주소(운영·미리보기)를 친다.
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3100' }}
      LOCAL_TARGET: ${{ github.event.inputs.base_url == '' && 'true' || 'false' }}
      # CF Order 2 Skip 룰의 이중 검증용 secret (UA + Secret).
      # GitHub Secrets에 E2E_SECRET 등록 필수 (5/16 봇 UA 위장 대응).
      E2E_SECRET: ${{ secrets.E2E_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 10/2 dev QA: 9/29 release 분리 이후 운영 = `release` 브랜치인데, 스케줄 실행은 기본 브랜치(main)를
          # 체크아웃해 main 스펙으로 운영을 쳤다. main 에서 스펙을 바꾸면 release 반영 전까지 07:00 운영 E2E 가
          # 깨진다. 스케줄은 운영과 같은 트리(release)의 스펙으로, 수동 실행은 고른 ref(미리보기 대상 등)로.
          ref: ${{ github.event_name == 'schedule' && 'release' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 러너 안 운영 빌드 — 읽기 키만 준다. 서비스 롤 키(쓰기)는 넣지 않아 테스트가 운영 DB 에 쓸 길이 없다
      # (write 엔드포인트는 어차피 e2e UA 로 건너뛴다 — internal-traffic). 공공 API 가 미국 러너에서 막히면
      # 화면은 정적 폴백이고, 그 경우도 운영과 같은 코드 경로다. 오리진 잠금은 시크릿이 없고 localhost 라 꺼진다.
      - name: Build (release tree, production mode)
        if: env.LOCAL_TARGET == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          SGIS_KEY: ${{ secrets.SGIS_KEY }}
          SGIS_SECRET: ${{ secrets.SGIS_SECRET }}

      - name: Start server
        if: env.LOCAL_TARGET == 'true'
        run: |
          nohup npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/ || true)
            if [ "$code" = "200" ]; then echo "server ready (${i}s)"; exit 0; fi
            sleep 1
          done
          echo "::error::next start 가 60초 안에 200 을 주지 않음"; tail -50 next-start.log; exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          SGIS_KEY: ${{ secrets.SGIS_KEY }}
          SGIS_SECRET: ${{ secrets.SGIS_SECRET }}

      - name: Run Playwright tests
        run: npx playwright test

      # 5/17 보안 사고 fix: Playwright trace.zip + report 에 x-irang-e2e-secret
      # 헤더 평문 포함 + public repo artifact 다운로드 가능 → token 유출 → 봇 우회.
      # CF Order 2 24h 9.89k events (정상 CI 100건 미만 대비 99배 이상).
      # → trace artifact 업로드 영구 비활성화. debug 필요 시 회장이 workflow_dispatch
      #   `dispatch_with_trace: true` input으로 일시적으로 활성화 (별도 PR 필요).
