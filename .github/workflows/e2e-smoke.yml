# ═══════════════════════════════════════════
# 푸시 시점 최소 안전망 — @smoke 2건만
#
# 2026-09-17 신설 (회장 지시 — Vercel Hobby 한도 조치).
# 전체 E2E 를 푸시마다 프로덕션에 돌리면 Fluid Active CPU·Function Invocations 를
# 자체 소비한다(하루 20~26 푸시). 전체 스위트는 `e2e.yml` 이 하루 1회 돌리고,
# 여기서는 **실제로 회귀를 잡아 온 여정 2건**만 남긴다.
#   - 지역 탐색 → 시군구 상세 → compare: 9/17 아코디언 회귀를 이 테스트가 잡았다
#   - /assess 위저드 완주: M7 핵심 전환 경로
# ═══════════════════════════════════════════
name: E2E smoke

# 10/2 dev QA: 트리거를 `push: main` → **운영 배포 완료(deployment_status)** 로 바꿨다.
# 9/29 release 분리 이후 main 푸시는 미리보기만 만들고 운영(irangfarm.com)은 그대로라,
# main 푸시마다 운영을 치는 smoke 는 바뀐 코드를 검증하지 못한 채 운영 함수 사용량만 늘렸다.
# 이제 운영 배포가 성공했을 때 그 배포 커밋(release)의 스펙으로 운영을 친다 — cf-purge.yml 과 같은 판정.
# (deployment_status 는 배포 커밋의 워크플로 파일을 쓰므로 이 변경은 release 에 반영된 뒤부터 동작한다.)
on:
  deployment_status:
  workflow_dispatch:

# 10/7: Vercel 배포 신호는 ref 가 비어 와서(커밋 SHA 로 배포) 모든 실행이 'e2e-smoke-' 한 묶음이었다 —
# main 미리보기 신호(건너뛸 실행)가 진행 중이던 운영 점검을 취소했다("higher priority waiting request for e2e-smoke-").
# 배포 환경(Production·Preview)별로 묶는다 — 새 운영 배포만 이전 운영 점검을 대체한다.
concurrency:
  group: e2e-smoke-${{ github.event.deployment.environment || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright @smoke
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: "https://irangfarm.com"
      E2E_SECRET: ${{ secrets.E2E_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: CF purge 전파 대기
        # 배포 완료(deployment_status success) 시점에 발화하므로 Vercel 대기는 필요 없고,
        # 같은 이벤트로 도는 cf-purge.yml 이 엣지 캐시를 비울 시간만 둔다.
        run: sleep 60

      - name: Run @smoke tests
        run: npx playwright test --grep @smoke
